name: build_deploy.yml
on:
  push:
    branches:
      - main
permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  # Build job
  build:
    # Specify runner + build & upload the static files as an artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.0'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'server/composer.json'

      # Secrets are not written here: anything in this job ends up in the downloadable
      # build artifact. The deploy job writes server/.env.local straight to the server.
      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        working-directory: server
        env:
          # Warm the prod cache so the server never has to build it. Env vars are
          # resolved at runtime, so no secret values are baked into the cache.
          APP_ENV: prod
          # Placeholder so the container compiles before a real DATABASE_URL exists;
          # the server's .env.local supplies the real one.
          DATABASE_URL: 'mysql://build:build@127.0.0.1:3306/build?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
        run: composer validate --no-check-publish && composer update --prefer-dist --no-progress


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        working-directory: 'client'
        run: npm install && npm run build && rm -rf node_modules

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload bundle for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: release.zip

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      HOST: ${{ vars.HOST }}
      USER: ${{ vars.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
    steps:
      - name: Check .env secret
        env:
          ENV_SECRET: ${{ secrets.DEV_DOT_ENV }}
        run: |
          if [ -z "$ENV_SECRET" ]; then
            echo "::error::Secret DEV_DOT_ENV is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: bundle
          
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

      - name: Clean remote directory
        run: ssh $USER@$HOST 'rm -rfv /home/github-service/web/*'

      - name: Upload release
        run: scp -C -v release.zip $USER@$HOST:/home/github-service/web/

      - name: Extract release
        run: ssh $USER@$HOST 'cd /home/github-service/web && unzip -o release.zip && rm release.zip'

      # Sent over stdin so the contents never appear in a command line on either machine.
      - name: Create .env.local from secret
        env:
          ENV_SECRET: ${{ secrets.DEV_DOT_ENV }}
        run: |
          printf '%s\n' "$ENV_SECRET" \
            | ssh $USER@$HOST 'umask 022 && cat > /home/github-service/web/server/.env.local'

      - name: Start docker containers
        run: ssh $USER@$HOST 'cd /home/github-service/web/docker && docker compose -f docker-compose.yaml up -d --build'