name: build_deploy.yml
on:
  push:
    branches:
      - main
permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  # Build job
  build:
    # Specify runner + build & upload the static files as an artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.0'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'server/composer.json'

      - name: Create .env.local from secret
        working-directory: server
        env:
          ENV_SECRET: ${{ secrets.ENV_LOCAL }}
        run: echo "$ENV_SECRET" > .env.local

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        working-directory: server
        run: composer validate --no-check-publish && composer update --prefer-dist --no-progress


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        working-directory: 'client'
        run: npm install && npm run build && rm -rf node_modules

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload bundle for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: release.zip

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      HOST: ${{ vars.HOST }}
      USER: ${{ vars.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: bundle
          
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

      - name: Clean remote directory
        working-directory: /home/kraft
        run: ssh $USER@$HOST 'rm -rfv /home/kraft/web/*'

      - name: Upload release
        run: scp -C -v release.zip $USER@$HOST:/home/kraft/web/

      - name: Extract release
        run: ssh $USER@$HOST 'cd /home/kraft/web && unzip -o release.zip && rm release.zip'

      - name: Start docker containers
        run: ssh $USER@$HOST 'cd /home/kraft/web/docker && docker compose -f docker-compose.yml up -d'