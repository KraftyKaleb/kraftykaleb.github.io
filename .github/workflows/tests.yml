name: tests
on:
  pull_request:
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci
          # The test env appends "_test" to the database name (see doctrine.yaml).
          MARIADB_DATABASE: app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Throwaway values for CI only. No real secrets are used here.
      APP_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'mysql://root:ci@127.0.0.1:3306/app?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

      # Builds the prod container, which catches prod-only config errors the tests miss.
      - name: Clear prod cache
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
        run: php bin/console cache:clear
