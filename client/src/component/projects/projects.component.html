<section>
    <h1>Projects</h1>
    <p>Work that reflects how I build, solve, and experiment.</p>

    @for (section of sections(); track section.category.id) {
        <h2>{{ section.category.name }}</h2>
        <p>{{ section.category.description }}</p>
        <div class="card-group">
            @for (project of section.projects; track $index) {
                <app-project [project]="project" />
            }
        </div>
    }
</section>
