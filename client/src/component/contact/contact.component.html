<section>
  <div class="container">
    <h3>Contact</h3>
    <p>Have a question or want to work together? Send me a message and I'll get back to you.</p>

    @if (status() === 'sent') {
      <p class="notice success" role="status">Thanks! Your message is on its way, and a confirmation has been sent to your email.</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <label>
          Name
          <input type="text" formControlName="name" autocomplete="name" maxlength="100" [attr.aria-invalid]="invalid('name')">
          @if (invalid('name')) { <span class="hint">Please enter your name.</span> }
        </label>
        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" maxlength="180" [attr.aria-invalid]="invalid('email')">
          @if (invalid('email')) { <span class="hint">Please enter a valid email address.</span> }
        </label>
      </div>
      <label>
        <span>Subject <span class="optional">(optional)</span></span>
        <input type="text" formControlName="subject" maxlength="150">
      </label>
      <label>
        Message
        <textarea formControlName="message" rows="6" maxlength="5000" [attr.aria-invalid]="invalid('message')"></textarea>
        @if (invalid('message')) { <span class="hint">Please enter a message.</span> }
      </label>

      @if (status() === 'error') {
        <p class="notice error" role="alert">{{ error() }}</p>
      }

      <div class="contact-links">
        <button type="submit" class="btn primary" [disabled]="status() === 'sending'">
          <i class="pi pi-send"></i> {{ status() === 'sending' ? 'Sending…' : 'Send Message' }}
        </button>
        <a href="https://www.linkedin.com/in/kalebgilson" target="_blank" rel="noopener" class="btn secondary"><i class="pi pi-linkedin"></i> LinkedIn</a>
      </div>
    </form>
  </div>
</section>
