<div class="admin-heading">
    <h2>Categories</h2>
</div>
<p class="admin-muted">Each category is a section of the projects page, shown lowest order first.</p>
@if (error(); as message) {
    <p class="admin-error" role="alert">{{ message }}</p>
}
<table class="admin-table">
    <thead>
        <tr><th>Name</th><th>Description</th><th>Order</th><th>Projects</th><th></th></tr>
    </thead>
    <tbody>
        @for (row of rows(); track row.id) {
            <tr [formGroup]="row.form">
                <td><input formControlName="name" aria-label="Name" required /></td>
                <td><textarea formControlName="description" rows="2" aria-label="Description"></textarea></td>
                <td><input formControlName="ordinal" type="number" step="1" class="admin-narrow" aria-label="Order" required /></td>
                @let projects = projectCounts().get(row.id) ?? 0;
                <td>{{ projects }}</td>
                <td class="admin-row-actions">
                    <button class="btn secondary" type="button" (click)="save(row)" [disabled]="row.busy() || row.form.pristine">{{ row.saved() ? 'Saved' : 'Save' }}</button>
                    <button class="btn danger" type="button" (click)="delete(row)" [disabled]="row.busy() || projects > 0"
                            [title]="projects > 0 ? 'Move or delete its ' + projects + ' project(s) first' : ''">Delete</button>
                </td>
            </tr>
        }
        <tr [formGroup]="draft">
            <td><input formControlName="name" placeholder="Side Projects" aria-label="New category name" /></td>
            <td><textarea formControlName="description" rows="2" aria-label="New category description"></textarea></td>
            <td><input formControlName="ordinal" type="number" step="1" class="admin-narrow" aria-label="New category order" /></td>
            <td></td>
            <td class="admin-row-actions">
                <button class="btn primary" type="button" (click)="add()" [disabled]="adding()">Add category</button>
            </td>
        </tr>
    </tbody>
</table>
